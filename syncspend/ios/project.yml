name: SyncSpend
options:
  bundleIdPrefix: com.tandem
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: false
    INFOPLIST_FILE: SyncSpend/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.tandem.SyncSpend
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  SyncSpend:
    type: application
    platform: iOS
    sources:
      - path: SyncSpend
    dependencies:
      - target: SyncSpendWidgetExtension
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: SyncSpend/Info.plist
        PRODUCT_NAME: SyncSpend

  SyncSpendWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SyncSpendWidget
      - path: SyncSpend/Engine
      - path: SyncSpend/Models
      - path: SyncSpend/Theme
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tandem.SyncSpend.SyncSpendWidgetExtension
        INFOPLIST_FILE: SyncSpendWidget/Info.plist
        PRODUCT_NAME: SyncSpendWidgetExtension
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"

  SyncSpendTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SyncSpendTests
    dependencies:
      - target: SyncSpend
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tandem.SyncSpendTests
        PRODUCT_NAME: SyncSpendTests

schemes:
  SyncSpend:
    build:
      targets:
        SyncSpend: all
        SyncSpendWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SyncSpendTests

  SyncSpendWidgetExtension:
    build:
      targets:
        SyncSpendWidgetExtension: all
    run:
      config: Debug
      environmentVariables:
        - variable: _XCWidgetKind
          value: com.tandem.syncspend.daily-allowance
          isEnabled: true
        - variable: _XCWidgetDefaultView
          value: timeline
          isEnabled: true
        - variable: _XCWidgetFamily
          value: systemSmall
          isEnabled: true

  WeeklySpendWidget:
    build:
      targets:
        SyncSpendWidgetExtension: all
    run:
      config: Debug
      environmentVariables:
        - variable: _XCWidgetKind
          value: com.tandem.syncspend.weekly-spend
          isEnabled: true
        - variable: _XCWidgetDefaultView
          value: timeline
          isEnabled: true
        - variable: _XCWidgetFamily
          value: systemSmall
          isEnabled: true

