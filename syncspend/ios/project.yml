name: SyncSpend
options:
  bundleIdPrefix: com.tandem
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: false
    INFOPLIST_FILE: SyncSpend/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.tandem.SyncSpend
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  SyncSpend:
    type: application
    platform: iOS
    sources:
      - path: SyncSpend
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: SyncSpend/Info.plist
        PRODUCT_NAME: SyncSpend
